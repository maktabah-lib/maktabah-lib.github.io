<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIC Library Catalog</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <h1>TIC Library Catalog</h1>
        <div class="search-container" id="searchContainer">
            <input type="text" id="searchInput" placeholder="Search books by title, author, or ISBN..." class="search-input">
        </div>
    </header>

    <main class="catalog-main">
        <div class="book-list" id="bookList"></div>
        <div class="book-detail" id="bookDetail" style="display:none;"></div>
        <div class="pagination" id="pagination"></div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Toronto Islamic Center</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
