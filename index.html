<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maktabah: Library Catalog</title>
    <link rel="icon" type="image/x-icon" href="./images/favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-top">
            <h1><a href="./index.html" style="color: white; text-decoration: none;">Maktabah: Library Catalog</a></h1>
            <button id="darkModeToggle" class="dark-mode-toggle" title="Toggle Dark Mode">
                <span class="toggle-icon">🌙</span>
            </button>
        </div>
        <div class="search-container" id="searchContainer">
            <input type="text" id="searchInput" placeholder="Search books by title, author, ISBN, shelf no., etc ..." class="search-input">
        </div>
        <div class="header-feedback">
            <i>Feedback forms: <a href="https://forms.gle/Tq9fv9zXuXfPUCft5">Request a feature/give feedback</a>  or  <a href="https://forms.gle/fLm2HizbWKBiUSz66">Report an issue</a></i>
        </div>
    </header>

    <main class="catalog-main">
        
        <div class="book-list" id="bookList"></div>
        <div class="book-detail" id="bookDetail" style="display:none;"></div>
        <div class="pagination" id="pagination"></div>
    </main>

    <!-- Image Popup Overlay -->
    <div id="imagePopup" class="popup-overlay" style="display: none;">
        <div class="popup-header">
            <div id="popupImageCounter" class="popup-image-counter">1/1</div>
            <span class="close-popup">&times;</span>
        </div>
        
        <!-- Navigation arrows for popup -->
        <button id="popupPrevArrow" class="popup-nav-arrow" disabled>&#10094;</button>
        
        <!-- Image container for popup -->
        <div class="popup-image-container">
            <img id="popupImage" class="popup-image" src="" alt="Enlarged book image">
        </div>
        
        <!-- Navigation arrows for popup -->
        <button id="popupNextArrow" class="popup-nav-arrow" disabled>&#10095;</button>
    </div>

    <footer class="footer">
        <p>Maktabah Library Catalog (2026)</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
